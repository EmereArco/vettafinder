name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Crea progetto Expo e installa dipendenze
        run: |
          set -o pipefail
          npx --yes create-expo-app@latest build --template blank-typescript --yes 2>&1 | tee install.log
          cp -r App.tsx index.ts app.json src assets scripts build/
          cd build
          npx expo install @expo/vector-icons expo-camera expo-location expo-sensors expo-status-bar \
            react-native-safe-area-context react-native-svg react-native-webview upng-js 2>&1 | tee -a ../install.log
          node -e "const p=require('./package.json');p.main='index.ts';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          echo "::notice title=versioni::expo $(node -p "require('expo/package.json').version") / RN $(node -p "require('react-native/package.json').version")"

      - name: Test del terreno (Torino)
        working-directory: build
        run: npx --yes tsx scripts/test-terrain.ts

      - name: Genera progetto Android
        working-directory: build
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee ../prebuild.log

      - name: Compila APK
        working-directory: build/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --console=plain 2>&1 | tee ../../gradle.log

      - name: Rinomina APK
        run: cp build/android/app/build/outputs/apk/release/app-release.apk VettaFinder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VettaFinder-apk
          path: VettaFinder.apk

      - name: Pubblica release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VettaFinder (build ${{ github.run_number }})
          body: Scarica VettaFinder.apk dal telefono Android e aprilo per installarlo.
          files: VettaFinder.apk
          make_latest: true

      # In caso di errore riporta le ultime righe dei log come annotazioni leggibili dall'API
      - name: Riepilogo errore
        if: failure()
        run: |
          for f in install.log prebuild.log gradle.log; do
            [ -f "$f" ] || continue
            grep -n -i -E "error|failed|what went wrong|ERESOLVE|exception" "$f" | tail -n 40 > err.txt || true
            [ -s err.txt ] || tail -n 40 "$f" > err.txt
            split -b 3500 err.txt part_
            for p in part_*; do
              msg=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
              echo "::error title=$f::$msg"
            done
            rm -f part_* err.txt
          done
