name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verifica Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Installa dipendenze
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Genera progetto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compila APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VettaFinder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VettaFinder-apk
          path: VettaFinder.apk

      - name: Pubblica release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VettaFinder (build ${{ github.run_number }})
          body: Scarica VettaFinder.apk dal telefono Android e aprilo per installarlo.
          files: VettaFinder.apk
          make_latest: true
